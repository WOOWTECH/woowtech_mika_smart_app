# WOOWTECH fork: 渥屋助理的版本（繁中＋英文）。檔名與欄位 id 不能改：App 的「去 GitHub 回報」會開 ?template=device-report.yml。
# title 要和 app/src/woowtech/resources/brand.properties 的 issue.title.prefix 一致（App 預填的標題用它）。
name: 機型相容性回報 / Device compatibility report
description: 貼上渥屋助理「相容性自我檢查」的報告，告訴我們這支手機上哪些能用 / Paste the report from woowtech agent's compatibility self-check and tell us what works on your phone
title: "[相容性] "
body:
  - type: markdown
    attributes:
      value: |
        在渥屋助理打開 **設定 › 恢復與修復 › 相容性自我檢查**，按「開始檢查」，大約 1 分鐘。跑完按「去 GitHub 回報」會複製報告並打開這一頁，把報告貼到下面的「自我檢查報告」。
        報告裡只有機型、系統版本和每一項的結果，不含帳號、App 清單和你的內容；送出前請再看一遍。

        In woowtech agent, open **Settings › Recovery & repair › Compatibility self-check** and tap "Start" (about 1 minute). When it finishes, "Report on GitHub" copies the report and opens this page; paste it into "Self-check report" below.
        The report only has the phone model, system version and the result of each check, with no accounts, app lists or your content. Please read it before posting.
  - type: input
    id: model
    attributes:
      label: 手機型號 / Phone model
      description: 廠牌和型號 / Manufacturer and model
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Android 與系統版本 / Android and system version
      description: Android 版本，以及手機系統自己的版本號（如果有） / Android version, plus the phone's own system version if it has one
    validations:
      required: true
  - type: input
    id: mika-version
    attributes:
      label: 渥屋助理版本 / woowtech agent version
      description: 設定 › 關於渥屋助理 / Settings › About woowtech agent
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: 自我檢查報告 / Self-check report
      description: 貼上「相容性自我檢查」的報告全文 / Paste the whole self-check report
      render: text
    validations:
      required: true
  - type: dropdown
    id: pairing
    attributes:
      label: 手機操作的配對成功了嗎？ / Did phone control pairing work?
      options:
        - 成功 / Yes
        - 沒成功 / No
        - 用電腦經 USB 啟動 / Started from a computer over USB
        - 沒試 / Didn't try
    validations:
      required: true
  - type: dropdown
    id: tasks
    attributes:
      label: 操作手機 App 的任務能跑嗎？ / Do tasks that use phone apps run?
      options:
        - 能 / Yes
        - 部分能 / Partly
        - 不能 / No
        - 沒試 / Didn't try
    validations:
      required: true
  - type: checkboxes
    id: failed
    attributes:
      label: 哪些沒通過？ / Which checks didn't pass?
      description: 照報告勾選（都通過就不用勾） / Tick the ones the report shows as failed or partial (none if all passed)
      options:
        - label: 裝置 / Device
        - label: 權限 / Permissions
        - label: 內建助手 / Built-in helper
        - label: 虛擬螢幕 / Virtual display
        - label: 開啟 App / Opening apps
        - label: 讀取螢幕 / Reading the screen
        - label: 點按和打字 / Taps and typing
        - label: 持續運作 / Keeps running
        - label: 不打擾你的螢幕 / Your screen undisturbed
        - label: 內建瀏覽器 / Built-in browser
        - label: 沙箱 / Sandbox
        - label: 分身與工作資料夾 / App copies
  - type: textarea
    id: notes
    attributes:
      label: 其他補充 / Anything else
      description: 你看到了什麼、在做什麼任務時出問題（不要貼帳號、密碼和私人內容） / What you saw and what the task was (no accounts, passwords or private content)
