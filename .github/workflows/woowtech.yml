# WOOWTECH fork: brand checks and the woowtech APK build. Not part of upstream Mika; see docs-woowtech/FORK.md.
# Upstream's ci.yml keeps running its own tests (on the upstream flavor). Releases are never signed here:
# the unsigned release APKs are downloaded and signed with apksigner on the release machine.
name: woowtech

on:
  push:
    branches: [main, "woowtech/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: woowtech-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  brand:
    name: brand checks (sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Release worker safety tests
        run: python3 -m unittest discover -s woowtech/release -v
      - name: No China-based services
        run: sh woowtech/tools/check-no-cn-services.sh
      - name: Brand leaks in sources
        run: sh woowtech/tools/brand-check.sh sources

  apk:
    name: woowtech APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Bootstrap verified Gradle distribution
        timeout-minutes: 7
        run: python3 .github/scripts/bootstrap-gradle.py
      - name: Prepare verified private compiler repository
        timeout-minutes: 6
        run: python3 .github/scripts/prepare-compiler-repository.py
      - name: Brand layer tests
        run: ./gradlew --init-script .github/scripts/verified-compiler.init.gradle :core:test --tests "com.wangzan101.mika.core.brand.*" --stacktrace
      - name: Build woowtech release (unsigned) and debug
        run: ./gradlew --init-script .github/scripts/verified-compiler.init.gradle :app:assembleWoowtechRelease :app:assembleWoowtechDebug --stacktrace
      - name: Brand checks (APK)
        run: |
          for apk in app/build/outputs/apk/woowtech/release/*.apk; do
            sh woowtech/tools/brand-check.sh apk "$apk"
          done
      - name: Checksums
        run: cd app/build/outputs/apk/woowtech && find . -name '*.apk' -exec sha256sum {} + | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: woowtech-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/woowtech/**/*.apk
            app/build/outputs/apk/woowtech/SHA256SUMS.txt
          retention-days: 14
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: woowtech-reports
          path: |
            core/build/reports/tests/test
            app/build/reports
          retention-days: 7
          if-no-files-found: ignore

  release-plan:
    name: WOOW release plan
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 woowtech/release/plan.py

  # GPL/LGPL/MPL corresponding source for a release (tools/sandbox/README.md, "发布 APK 时一起发布源码包").
  # New main version or manual run: publish the corresponding source next to both signed APKs.
  gpl-sources:
    name: GPL sources tarball
    needs: release-plan
    if: needs.release-plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build mika-<version>-gpl-sources.tar.gz
        run: |
          set -eu
          # defaultConfig's numeric versionName only: the woowtech flavor's own versionName line also matches "versionName = ".
          UP=$(sed -n 's/^ *versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          REV=$(sed -n 's/^val woowtechRevision = \([0-9][0-9]*\).*/\1/p' app/brand.gradle.kts)
          VERSION="$UP-woow.$REV"
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+-woow\.[0-9]+$ ]] || { echo "unexpected version: $VERSION"; exit 1; }
          echo "version $VERSION"
          NAME=mika-$VERSION-gpl-sources
          OUT=build/gpl-sources/$NAME
          rm -rf "$OUT" && mkdir -p "$OUT"
          while read -r name version url sum; do
            case "$name" in ''|'#'*) continue ;; esac
            curl -fsSL "$url" -o "$OUT/$name-$version.tar.gz"
            echo "$sum  $OUT/$name-$version.tar.gz" | shasum -a 256 -c -
          done < tools/sandbox/sources.lock
          cp -R tools/sandbox/patches tools/sandbox/sources.lock tools/sandbox/build-native.sh tools/sandbox/README.md "$OUT/"
          cp licenses/GPL-2.0.txt licenses/GPL-3.0.txt licenses/LGPL-3.0.txt "$OUT/"
          python3 tools/sandbox/runtime-sources.py "$OUT/runtime"
          cp tools/sandbox/build-runtime.py tools/sandbox/runtime-sources.py app/src/main/assets/runtime/packages.json "$OUT/runtime/"
          cp -R tools/sandbox/runtime "$OUT/runtime/lock"
          tar -czf "build/gpl-sources/$NAME.tar.gz" -C build/gpl-sources "$NAME"
          tar -tzf "build/gpl-sources/$NAME.tar.gz" | head -40 || true  # head closes the pipe early; pipefail is on
          sha256sum "build/gpl-sources/$NAME.tar.gz" | tee "build/gpl-sources/$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: gpl-sources-${{ github.sha }}
          path: build/gpl-sources/*.tar.gz*
          retention-days: 30
