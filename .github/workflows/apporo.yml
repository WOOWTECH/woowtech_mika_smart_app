name: apporo
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apporo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Bootstrap verified Gradle distribution
        timeout-minutes: 7
        run: python3 .github/scripts/bootstrap-gradle.py
      - name: Prepare verified private compiler repository
        timeout-minutes: 6
        run: python3 .github/scripts/prepare-compiler-repository.py
      - name: Source and CLI contracts
        run: |
          python3 apporo/tools/check.py
          node --test apporo/tools/test_browser_page.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s apporo/tools -p 'test_startup_smoke.py'
          python3 -m unittest discover -s tools/mika/tests
          sh woowtech/tools/brand-check.sh sources
          sh woowtech/tools/check-no-cn-services.sh
      # ci.yml runs the full core, Android, CLI and relay suites for the same PR.
      # Keep APK compilation separate so it does not repeat those suites in a third build graph.
      - name: Build Apporo debug and unsigned release
        run: ./gradlew --init-script .github/scripts/verified-compiler.init.gradle :app:assembleApporoDebug :app:assembleApporoRelease --max-workers=1 -Pkotlin.daemon.jvmargs=-Xmx4g --stacktrace
      - name: Verify packaged Apporo identity
        run: python3 apporo/tools/check-apk.py app/build/outputs/apk/apporo/release/*.apk
      - name: Upload universal debug startup candidate
        uses: actions/upload-artifact@v7
        with:
          name: apporo-startup-debug-${{ github.sha }}
          path: app/build/outputs/apk/apporo/debug/*universal-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload arm64 emulator candidate
        uses: actions/upload-artifact@v7
        with:
          name: apporo-arm64-unsigned-${{ github.sha }}
          path: app/build/outputs/apk/apporo/release/*arm64-v8a-release-unsigned.apk
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apporo-assistant-${{ github.sha }}
          path: app/build/outputs/apk/apporo/**/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: apporo-test-reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

  startup-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # AOSP default avoids Google APIs ARM translation triggering sandbox preparation.
    strategy:
      fail-fast: false
      matrix:
        api: [30, 32, 35, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: actions/download-artifact@v8
        with:
          name: apporo-startup-debug-${{ github.sha }}
          path: startup-apk
      # GitHub's documented KVM permissions for disposable hosted Linux runners.
      - name: Enable KVM
        run: |
          mkdir -p startup-evidence
          exec > >(tee startup-evidence/kvm-setup.log) 2>&1
          id
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          for attempt in {1..10}; do
            if test -r /dev/kvm && test -w /dev/kvm; then break; fi
            sleep 1
          done
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Bounded startup smoke (no helper or model)
        run: python3 apporo/tools/startup-smoke.py --api ${{ matrix.api }} --apk startup-apk --out startup-evidence
      - name: Record setup failure if smoke did not start
        if: always()
        env:
          SMOKE_API: ${{ matrix.api }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('startup-evidence')
          out.mkdir(exist_ok=True)
          receipt = out / 'receipt.json'
          if not receipt.exists():
              receipt.write_text(json.dumps(dict(status='NOT_RUN_SETUP_FAILED_OR_CANCELLED',
                  api=int(os.environ['SMOKE_API']), abi='x86_64', source_sha=os.environ['GITHUB_SHA']), indent=2))
          PY
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apporo-startup-api${{ matrix.api }}-x86_64-${{ github.sha }}
          path: startup-evidence/
          retention-days: 7
          if-no-files-found: error
