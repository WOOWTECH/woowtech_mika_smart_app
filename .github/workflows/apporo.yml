name: apporo
on:
  push:
    branches: ['apporo/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apporo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Source and CLI contracts
        run: |
          python3 apporo/tools/check.py
          python3 -m unittest discover -s tools/mika/tests
          sh woowtech/tools/brand-check.sh sources
          sh woowtech/tools/check-no-cn-services.sh
      - name: Shared tests and Apporo build
        run: ./gradlew :core:test :app:testUpstreamDebugUnitTest :app:assembleApporoDebug :app:assembleApporoRelease --stacktrace
      - name: Verify packaged Apporo identity
        run: python3 apporo/tools/check-apk.py app/build/outputs/apk/apporo/release/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apporo-assistant-${{ github.sha }}
          path: app/build/outputs/apk/apporo/**/*.apk
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: apporo-test-reports-${{ github.sha }}
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
