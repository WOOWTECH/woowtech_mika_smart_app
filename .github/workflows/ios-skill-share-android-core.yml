name: iOS skill share to Android core

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/Sources/AssistantSkills/**'
      - 'ios/Sources/AssistantModels/**'
      - 'ios/Sources/App/MemoryDataView.swift'
      - 'ios/scripts/GenerateAndroidSkillShareFixtures.swift'
      - 'core/src/**'
      - 'core/build.gradle.kts'
      - 'gradle/**'
      - '.github/scripts/**'
      - '.github/workflows/ios-skill-share-android-core.yml'

permissions:
  contents: read

jobs:
  swift-export-android-import:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build real Swift exporter and generate synthetic inputs
        shell: bash
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d "$RUNNER_TEMP/woow-skill-share.XXXXXX")"
          mkdir "$task_dir/build" "$task_dir/fixtures"
          echo "WOOW_SKILL_SHARE_FIXTURES=$task_dir/fixtures" >> "$GITHUB_ENV"
          swiftc -swift-version 5 -parse-as-library -emit-module -emit-library -module-name AssistantModels \
            ios/Sources/AssistantModels/*.swift -emit-module-path "$task_dir/build/AssistantModels.swiftmodule" \
            -o "$task_dir/build/libAssistantModels.dylib"
          swiftc -swift-version 5 -parse-as-library -emit-module -emit-library -module-name AssistantSkills \
            -I "$task_dir/build" -L "$task_dir/build" -lAssistantModels \
            ios/Sources/AssistantSkills/*.swift -emit-module-path "$task_dir/build/AssistantSkills.swiftmodule" \
            -o "$task_dir/build/libAssistantSkills.dylib"
          swiftc -swift-version 5 -parse-as-library -I "$task_dir/build" -L "$task_dir/build" \
            -lAssistantSkills -lAssistantModels -Xlinker -rpath -Xlinker "$task_dir/build" \
            ios/scripts/GenerateAndroidSkillShareFixtures.swift -o "$task_dir/generate"
          "$task_dir/generate" "$task_dir/fixtures"
          shasum -a 256 "$task_dir/fixtures/"*.md
      - name: Bootstrap verified Gradle distribution
        timeout-minutes: 7
        run: python3 .github/scripts/bootstrap-gradle.py
      - name: Prepare verified compiler repository
        timeout-minutes: 6
        run: python3 .github/scripts/prepare-compiler-repository.py
      - name: Run Android core import against Swift exports
        run: >-
          ./gradlew --no-daemon --init-script .github/scripts/verified-compiler.init.gradle
          :core:test --tests com.wangzan101.mika.core.skills.IOSSkillShareImportTest
          --rerun-tasks --stacktrace
      - name: Require all cross-platform cases to execute
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob('core/build/test-results/test/TEST-com.wangzan101.mika.core.skills.IOSSkillShareImportTest.xml')
          if len(paths) != 1:
              raise SystemExit('Expected one Android JUnit report; no silent skip')
          suite = ET.parse(paths[0]).getroot()
          counts = {key: int(suite.attrib.get(key, 0)) for key in ('tests', 'skipped', 'failures', 'errors')}
          if counts != {'tests': 7, 'skipped': 0, 'failures': 0, 'errors': 0}:
              raise SystemExit(f'Cross-platform cases did not all pass: {counts}')
          print(f'PASS real Swift exporter -> Android core SkillImport.prepare: {counts}')
          PY
      - name: Preserve synthetic fixtures and JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-skill-share-android-core-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ env.WOOW_SKILL_SHARE_FIXTURES }}
            core/build/test-results/test
