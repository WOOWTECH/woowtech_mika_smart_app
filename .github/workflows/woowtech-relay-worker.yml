name: WoowTech relay Worker checks
on:
  push:
    branches: [main]
    paths: ['tools/woowtech-relay-worker/**', '.github/workflows/woowtech-relay-worker.yml']
  pull_request:
    paths: ['tools/woowtech-relay-worker/**', '.github/workflows/woowtech-relay-worker.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/woowtech-relay-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/woowtech-relay-worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:accounts
      - run: npx wrangler deploy --dry-run
        env:
          CI: 'true'
