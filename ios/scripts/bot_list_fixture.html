<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>woowtechbot list fixture</title>
<style>
  body{margin:0;background:#141414;color:#eee;font:15px system-ui,sans-serif}
  [data-look=app]{position:fixed;inset:0;display:flex;flex-direction:column}
  .relative{position:relative;flex:1;display:flex;min-height:0}
  .contents{display:contents}
  #list{position:absolute;left:12px;top:12px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid #3a3a3c;background:#242426;color:#eee;font-size:18px}
  aside{position:absolute;inset:0;z-index:40;background:#141414;transform:translateX(-100%);transition:transform .2s;overflow:auto}
  aside.open{transform:none}
  [data-sidebar-top-slot]{display:flex;align-items:center;height:64px;padding:0 8px}
  .row{display:flex;gap:12px;align-items:center;padding:12px 16px;color:#eee;text-decoration:none}
  .row i{width:44px;height:44px;border-radius:12px;background:#0b69cc;display:inline-block}
  .row b{display:block;font-weight:600}.row span{color:#9a9a9e;font-size:13px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9a9a9e}
  main.chat{justify-content:flex-start;padding-top:72px;color:#eee}
  @media (min-width:768px){#list{display:none}aside{position:static;transform:none;width:280px;flex:none}}
  textarea{width:80%;height:44px;border-radius:22px;background:#242426;color:#eee;border:1px solid #3a3a3c;padding:10px 16px}
</style></head>
<body>
<div id="root"></div>
<script>
  // Mirrors the phone website (2026-11-27 bundle) for device checks of the bot list landing: an empty #root while it starts,
  // the app with the list button first and the bot list mounted but closed, the loading screen while it connects, and the
  // list closing whenever the selected bot changes (as its drawer hook does), here twice after the bots load.
  // iOS copy of the Android fixture (fa22299c): adds the md breakpoint and a log of what the page did (/test/list-events).
  const bots = [['b1', 'Inbox'], ['b2', 'Writer'], ['b3', 'Research'], ['b4', 'Planner']];
  let open = false, selected = null, loaded = false;
  const app = document.createElement('div'); app.dataset.look = 'app';
  app.innerHTML = `<div class="relative"><button type="button" id="list" aria-label="Open bot list" aria-expanded="false">&lsaquo;</button>
    <div class="contents"><div class="contents"><aside data-look="sidebar" data-sidebar><div data-sidebar-top-slot><span style="flex:1"></span></div>
    <div id="rows"></div></aside><main id="main" data-app-loading="app.loading.connecting">Connecting to your bots…</main></div></div></div>`;
  const log = what => navigator.sendBeacon('/test/list-event', JSON.stringify({what, open, selected, ms: Math.round(performance.now())}));
  function render() {
    const list = app.querySelector('#list'), aside = app.querySelector('aside'), main = app.querySelector('#main');
    list.setAttribute('aria-expanded', String(open)); aside.classList.toggle('open', open);
    app.querySelector('#rows').innerHTML = loaded ? bots.map(([id, name]) =>
      `<a class="row" data-sidebar-bot-row href="#" data-id="${id}"><i></i><div><b>${name}</b><span>bot ${id}</span></div></a>`).join('') : '';
    if (selected) {
      main.removeAttribute('data-app-loading'); main.className = 'chat';
      main.innerHTML = `<div>Chat: ${bots.find(b => b[0] === selected)[1]}</div><textarea placeholder="Message"></textarea>`;
    }
  }
  function select(id) { if (selected !== id) { selected = id; open = false; render(); log('select'); } }
  app.addEventListener('click', e => {
    if (e.target.closest('#list')) { open = true; render(); log('list-button'); }
    const row = e.target.closest('[data-sidebar-bot-row]');
    if (row) { e.preventDefault(); select(row.dataset.id); }
  });
  const t = Number(new URLSearchParams(location.search).get('t') || 1);
  setTimeout(() => { document.getElementById('root').append(app); render(); log('app'); }, 800 * t);   // the app, connecting
  setTimeout(() => { loaded = true; select('b1'); }, 2500 * t);                           // bots load, first bot selected
  setTimeout(() => select('b2'), 2800 * t);                                                // the remembered bot settles
  setTimeout(() => { if (selected === 'b2') select('b4'); }, 4600 * t);                  // a late change, after the list shows
</script>
</body></html>
