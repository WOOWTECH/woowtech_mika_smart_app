name: WoowAssistant
options:
  bundleIdPrefix: io.woowtech
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  AssistantContracts:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.contracts

  AssistantDomain:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantDomain
    dependencies:
      - target: AssistantContracts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.domain

  AssistantBrowser:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantBrowser
    dependencies:
      - target: AssistantModels
      - target: AssistantSkills
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.browser

  AssistantModels:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.models

  AssistantMCP:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/AssistantMCP
    dependencies:
      - target: AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.mcp

  AssistantMemory:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/AssistantMemory]
    dependencies:
      - target: AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.memory

  AssistantSkills:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/AssistantSkills]
    dependencies:
      - target: AssistantModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.skills

  AssistantPersistence:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources/AssistantPersistence]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant.persistence

  WoowAssistant:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources/App
    dependencies:
      - target: AssistantContracts
      - target: AssistantDomain
      - target: AssistantBrowser
      - target: AssistantModels
      - target: AssistantMCP
      - target: AssistantMemory
      - target: AssistantSkills
      - target: AssistantPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.woowtech.assistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 渥屋助理
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: Configuration/Info-Release.plist
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          INFOPLIST_FILE: Configuration/Info-Debug.plist

  AssistantDomainTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantDomainTests
    dependencies:
      - target: AssistantContracts
      - target: AssistantDomain
      - target: AssistantBrowser
      - target: AssistantModels

  AssistantModelsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantModelsTests
    dependencies:
      - target: AssistantModels

  AssistantMCPTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantMCPTests
    dependencies:
      - target: AssistantMCP
      - target: AssistantModels

  AssistantMemoryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/AssistantMemoryTests]
    dependencies:
      - target: AssistantMemory
      - target: AssistantModels

  AssistantSkillsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantSkillsTests
      - scripts/CheckProfileChatApp.swift
    dependencies:
      # Exercise PDFKit in the real UIKit host, as it runs in production.
      # Unhosted iOS tests have stalled during PDFDocument initialization.
      - target: WoowAssistant
      - target: AssistantSkills
      - target: AssistantModels
      - target: AssistantPersistence
      - target: AssistantMemory
      - target: AssistantMCP

  AssistantPersistenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests/AssistantPersistenceTests]
    dependencies:
      - target: AssistantPersistence

  WoowAssistantUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/WoowAssistantUITests
    dependencies:
      - target: WoowAssistant

  AssistantBrowserIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/AssistantBrowserIntegrationTests
      - scripts/CheckBrowserSiteModesApp.swift
      - Tests/AssistantDomainTests/BrowserUserSiteModesChecks.swift
      - scripts/CheckBrowserSearchApp.swift
      - Tests/AssistantDomainTests/BrowserSearchChecks.swift
      - scripts/CheckLearningRunContextApp.swift
      - scripts/CheckTaskNotificationApp.swift
      - scripts/CheckReplayReferencesApp.swift
      - scripts/CheckConversationArchiveApp.swift
      - scripts/CheckChatStreamingApp.swift
      - Tests/AssistantModelsTests/ModelProtocolFixture.swift
      - Tests/AssistantDomainTests/TaskNotificationChecks.swift
    dependencies:
      - target: WoowAssistant
      - target: AssistantBrowser
      - target: AssistantSkills
      - target: AssistantDomain
      - target: AssistantModels
      - target: AssistantMemory
      - target: AssistantPersistence
      - target: AssistantMCP

schemes:
  WoowAssistant:
    build:
      targets:
        WoowAssistant: all
        AssistantDomainTests: [test]
        AssistantModelsTests: [test]
        AssistantMCPTests: [test]
        AssistantMemoryTests: [test]
        AssistantSkillsTests: [test]
        AssistantPersistenceTests: [test]
        WoowAssistantUITests: [test]
        AssistantBrowserIntegrationTests: [test]
    test:
      targets:
        - AssistantDomainTests
        - AssistantModelsTests
        - AssistantMCPTests
        - AssistantMemoryTests
        - AssistantSkillsTests
        - AssistantPersistenceTests
        - WoowAssistantUITests
        - AssistantBrowserIntegrationTests
