# WOOWTECH fork: brand values for the woowtech flavor (渥屋助理 / woowtech agent).
# Read by core/src/main/kotlin/com/wangzan101/mika/core/brand/Brand.kt and app/brand.gradle.kts.
# Without this file every value falls back to upstream Mika.

name=woowtech agent
name.zh=渥屋助理
token=woowtech-agent
persona=渥屋助理 (woowtech agent)
download.folder=woowtech agent

company=WOOW TECH CO., LTD.
company.zh=渥屋科技股份有限公司
website=https://aiot.woowtech.io/
support.email=woowtech@designsmart.com.tw

repo=https://github.com/WOOWTECH/woowtech_mika_smart_app
repo.label=github.com/WOOWTECH/woowtech_mika_smart_app
releases.api=https://api.github.com/repos/WOOWTECH/woowtech_mika_smart_app/releases/latest

search.url=https://www.google.com/search?q=
ui.languages=en,zh-Hant

# Brand blue #6183FC; filled buttons with white text use #4069FB (4.53:1).
accent.light=FF4069FB
accent.dark=FF6183FC
accent.light.soft=1A4069FB
accent.dark.soft=296183FC

prompt.append.system/identity.md=Your name is 渥屋助理 in Chinese and woowtech agent in English. \
WOOW TECH CO., LTD. (渥屋科技), a smart-home company in Taiwan, provides this app; it is based on the \
open-source project Mika. System notes, tool results and the sandbox's `mika` command still say "Mika": \
that means you and this app. When you talk to the user, call yourself 渥屋助理 (woowtech agent in English) \
and never Mika. A person, contact or app named Mika is someone else.

# Role prompts whose output the user reads (skill drafts, memories, the summary after a stop, app knowledge notes) are
# Simplified Chinese upstream, and so was their output. Here they ask for Traditional Chinese as used in Taiwan.
# BrandValuesTest checks that each path still names a prompt and that the skill draft keeps SkillDrafter's headings.
prompt.append.roles/skill_draft.md=用字：這份技能會顯示給台灣的使用者看。display、description、aliases，以及五個小節底下的內文，\
都用台灣慣用的繁體中文寫（例如「使用者」「設定」「取得」）；目標是用英文寫的，就改用英文。\
頭部的欄位名、name，以及五個小節的標題（## 入口、## 步骤、## 容易出错的地方、## 怎样算办成(核实证据)、## 什么时候停下交给用户）\
照上面的格式一字不改，標題不要改成繁體字。App 名、按鈕和頁面上的字照畫面上寫的抄。
prompt.append.roles/memory_extract.md=用字：使用者說中文時，content 和 keywords 用台灣慣用的繁體中文寫（例如「使用者點外送不要香菜」）；\
使用者說英文時用英文。quote 照舊一字不改地抄使用者的原話；人名、地名、店名照使用者寫的字，不要換字。
prompt.append.roles/stop_summary.md=When the user writes in Chinese, write Traditional Chinese as used in Taiwan, \
even though the example above is in Simplified Chinese.
prompt.append.roles/app_knowledge.md=用字：每一條都用台灣慣用的繁體中文寫（目標是用英文寫的，就改用英文）。\
畫面上的名字（App 名、頁面、分頁、按鈕、提示文字）照 App 畫面上的字原樣寫，不要改字。沒有值得補的，仍然只輸出 NONE。
