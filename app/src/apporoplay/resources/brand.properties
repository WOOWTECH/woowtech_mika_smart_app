# Apporo Assistant Google Play edition (apporoplay): Apporo's brand values with a Play-edition identity prompt
# (no phone control, so it never claims to inspect installed apps or screens). Keep the rest in step with
# src/apporo/resources/brand.properties.
# Apporo Assistant brand; no WOOWTECH release or service fallback.
name=Apporo Assistant
name.zh=Apporo Assistant
token=apporo-assistant
persona=Apporo Assistant
download.folder=Apporo Assistant
company=APPORO UNION INC.
website=https://www.apporo.ai/
support.email=info@apporo.ai
repo=https://github.com/WOOWTECH/woowtech_mika_smart_app
readme.url=https://github.com/WOOWTECH/woowtech_mika_smart_app/blob/apporo/assistant/docs-apporo/README.md
