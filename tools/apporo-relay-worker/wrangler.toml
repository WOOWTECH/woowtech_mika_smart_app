name = "apporo-assistant-relay"
main = "src/index.ts"
compatibility_date = "2026-11-10"
workers_dev = false

routes = [
  { pattern = "assistant-relay.apporo.ai", custom_domain = true }
]

[[rules]]
type = "Text"
globs = ["**/*.py", "**/*.txt", "**/*.md"]
fallthrough = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AccountAuth"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountAuth"]

[observability]
enabled = false
