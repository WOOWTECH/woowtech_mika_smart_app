name = "apporo-assistant-relay"
main = "src/index.ts"
compatibility_date = "2026-11-10"
workers_dev = false

routes = [
  { pattern = "assistant-relay.apporo.ai", custom_domain = true }
]

# Static files served before the Worker (only exact file paths): the Play foreground-service demo video.
[assets]
directory = "./public"

[[rules]]
type = "Text"
globs = ["**/*.py", "**/*.txt", "**/*.md"]
fallthrough = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayDurableObject"]

[[durable_objects.bindings]]
name = "AUTH"
class_name = "AccountAuth"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountAuth"]

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "ReportInbox"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReportInbox"]

[observability]
enabled = false
